<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyectos — Reformas N&N Valencia</title>
  <meta name="description" content="Galería de reformas en Valencia">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
</head>
<body class="page-gallery">

  <header class="header header-simple scrolled" id="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l9-18 9 18"/><path d="M9 13h6"/></svg>
        </div>
        <span data-site="nombre">Reformas N&N</span>
      </a>
      <div class="header-actions">
        <a href="index.html#contacto" class="btn btn-cta btn-sm">Pedir presupuesto</a>
      </div>
    </div>
  </header>

  <main class="gallery-main">
    <section class="gallery-hero">
      <div class="container">
        <a href="index.html#proyectos" class="gallery-back">← Volver al inicio</a>
        <h1 id="gallery-title">Galería de proyectos</h1>
        <p id="gallery-subtitle" class="body-lg"></p>
      </div>
    </section>

    <section class="section section-alt gallery-section">
      <div class="container">
        <div class="gallery-filters" id="gallery-filters" role="tablist" aria-label="Filtrar proyectos"></div>
        <div class="projects-grid gallery-grid" id="gallery-grid"></div>
        <p class="gallery-empty" id="gallery-empty" hidden>No hay proyectos en esta categoría.</p>
      </div>
    </section>

    <section class="gallery-cta">
      <div class="container gallery-cta-inner">
        <h2>¿Te gusta lo que ves?</h2>
        <p>Solicita tu presupuesto gratuito sin compromiso.</p>
        <a href="index.html#contacto" class="btn btn-cta btn-lg">Solicitar presupuesto</a>
      </div>
    </section>
  </main>

  <footer class="footer footer-minimal">
    <div class="container footer-bottom">
      <p data-site="copyright"></p>
    </div>
  </footer>

  <!-- Visor de fotos -->
  <div class="lightbox" id="lightbox" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
    <div class="lightbox-backdrop" data-close-lightbox></div>
    <div class="lightbox-panel">
      <button type="button" class="lightbox-close" data-close-lightbox aria-label="Cerrar">&times;</button>
      <div class="lightbox-img-wrap">
        <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Foto anterior">‹</button>
        <img id="lightbox-img" src="" alt="">
        <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Foto siguiente">›</button>
      </div>
      <div class="lightbox-info">
        <h2 id="lightbox-title"></h2>
        <p id="lightbox-location"></p>
        <p id="lightbox-desc"></p>
        <p class="lightbox-counter" id="lightbox-counter"></p>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/project-utils.js"></script>
  <script src="js/projects-page.js"></script>
</body>
</html>
